<svg viewbox="0 0 1000 300" role="img" aria-label="Insertion state machine: descend, press, spiral, centre, insert, release.">
        <defs><marker id="ah" viewbox="0 0 10 10" refx="9" refy="5" markerwidth="7" markerheight="7" orient="auto-start-reverse"><path class="sm-arrow" d="M0,0 L10,5 L0,10 z"></path></marker></defs>
        <rect class="sm-box" x="20" y="40" width="150" height="70" rx="6"></rect><text class="sm-t" x="95" y="68" text-anchor="middle">descend</text><text class="sm-s" x="95" y="88" text-anchor="middle">setpoint sinks 10 mm/s</text>
        <rect class="sm-box" x="230" y="40" width="150" height="70" rx="6"></rect><text class="sm-t" x="305" y="68" text-anchor="middle">press</text><text class="sm-s" x="305" y="88" text-anchor="middle">4 N down, no sideways pull</text>
        <rect class="sm-box" x="440" y="40" width="150" height="70" rx="6"></rect><text class="sm-t" x="515" y="68" text-anchor="middle">spiral</text><text class="sm-s" x="515" y="88" text-anchor="middle">1 mm pitch, 5 mm/s, ≤ 8 N</text>
        <rect class="sm-box" x="440" y="200" width="150" height="70" rx="6"></rect><text class="sm-t" x="515" y="228" text-anchor="middle">centre</text><text class="sm-s" x="515" y="248" text-anchor="middle">go limp; chamfer guides</text>
        <rect class="sm-box" x="660" y="120" width="150" height="70" rx="6"></rect><text class="sm-t" x="735" y="148" text-anchor="middle">insert</text><text class="sm-s" x="735" y="168" text-anchor="middle">push ≤ 15 N to the floor</text>
        <rect class="sm-box go" x="850" y="120" width="130" height="70" rx="6"></rect><text class="sm-t" x="915" y="148" text-anchor="middle">release</text><text class="sm-s" x="915" y="168" text-anchor="middle">open, lift away</text>
        <path class="sm-e" d="M170,75 L228,75" marker-end="url(#ah)"></path><text class="sm-l" x="199" y="66" text-anchor="middle">F &gt; 2 N</text>
        <path class="sm-e" d="M380,75 L438,75" marker-end="url(#ah)"></path><text class="sm-l" x="409" y="66" text-anchor="middle">0.3 s, no drop</text>
        <path class="sm-e" d="M500,110 L500,198" marker-end="url(#ah)"></path><text class="sm-l" x="494" y="160" text-anchor="end">dips 0.8 mm</text>
        <path class="sm-e" d="M530,198 L530,112" marker-end="url(#ah)"></path><text class="sm-l" x="536" y="160">0.3 s, no drop</text>
        <path class="sm-e" d="M590,235 C630,235 640,170 658,165" marker-end="url(#ah)"></path><text class="sm-l" x="615" y="262">drops 3 mm</text>
        <path class="sm-e" d="M305,40 C305,8 700,8 730,118" marker-end="url(#ah)"></path><text class="sm-l" x="520" y="20" text-anchor="middle">drops 3 mm: the chamfer alone was enough</text>
        <path class="sm-e" d="M95,110 C95,205 600,200 660,150" marker-end="url(#ah)"></path><text class="sm-l" x="250" y="186">slides straight in without touching</text>
        <path class="sm-e" d="M810,155 L848,155" marker-end="url(#ah)"></path><text class="sm-l" x="829" y="146" text-anchor="middle">floor</text>
      </svg>
