[project]
name = "insertion"
version = "0.1.0"
description = "Contact-rich connector insertion with compliant control (CS5478 project)"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insertion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
